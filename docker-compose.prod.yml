# Minimum-cost full stack on one host (EC2).
# Usage (from Backend/ with Frontend sibling at ../Frontend/OpsPilot-AI-FE):
#   cp .env.production.example .env.production
#   # edit .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml exec app npx prisma migrate deploy
#
# Only HOST_HTTP_PORT (default 80) is published. Postgres/Redis stay on the internal network.
# Local tip: set HOST_HTTP_PORT=8080 in .env.production to avoid binding privileged port 80.

name: opspilot-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-OpsPilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-OpsPilot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - opspilot

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - opspilot

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: opspilot-backend:prod
    container_name: opspilot-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-OpsPilot}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - opspilot

  frontend:
    build:
      context: ../Frontend/OpsPilot-AI-FE
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?VITE_GOOGLE_CLIENT_ID is required}
    image: opspilot-frontend:prod
    container_name: opspilot-frontend
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - opspilot

volumes:
  postgres_data:
  redis_data:

networks:
  opspilot:
    driver: bridge
