apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: opspilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ranajitu/opspilot-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: opspilot-config
            - secretRef:
                name: opspilot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: opspilot
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000